name: Build Menar VPN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify libbox
        run: |
          test -f eagle-vpn/app/libs/libbox.aar
          unzip -t eagle-vpn/app/libs/libbox.aar >/dev/null
          ls -lh eagle-vpn/app/libs/libbox.aar

      - name: Build APK
        run: cd eagle-vpn && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: menar-vpn-apk
          path: eagle-vpn/app/build/outputs/apk/debug/app-debug.apk
