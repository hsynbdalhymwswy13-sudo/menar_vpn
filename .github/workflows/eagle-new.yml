name: Build EAGLE NEW VPN APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;36.0.0"

      - name: Download libbox AAR
        run: |
          mkdir -p eagle-new/app/libs
          curl --fail --location --retry 3 \
            --output eagle-new/app/libs/libbox.aar \
            https://github.com/singbox-android/libbox/releases/download/1.14.1/libbox.aar
          unzip -t eagle-new/app/libs/libbox.aar

      - name: Verify EAGLE sources
        run: |
          test -f eagle-new/gradlew
          test -s eagle-new/app/libs/libbox.aar
          unzip -t eagle-new/app/libs/libbox.aar
          echo "EAGLE NEW source and libbox AAR found"

      - name: Build debug APK
        working-directory: eagle-new
        env:
          GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload EAGLE NEW APK
        uses: actions/upload-artifact@v4
        with:
          name: eagle-new-apk
          path: eagle-new/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
