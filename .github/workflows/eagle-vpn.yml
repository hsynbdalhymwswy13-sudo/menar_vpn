name: Build EAGLE VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build EAGLE VPN
        working-directory: eagle-vpn
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload EAGLE APK
        uses: actions/upload-artifact@v4
        with:
          name: eagle-vpn-apk
          path: eagle-vpn/app/build/outputs/apk/debug/app-debug.apk
