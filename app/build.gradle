plugins {
    id 'com.android.application'
}

android {
    namespace 'com.menar.vpn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.menar.vpn'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation(name: 'libbox', ext: 'aar')
}
