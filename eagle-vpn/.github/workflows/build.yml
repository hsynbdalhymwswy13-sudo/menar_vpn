name: EAGLE VPN Build & Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EAGLE VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        working-directory: eagle-vpn
        run: chmod +x ./gradlew

      - name: Build EAGLE VPN
        working-directory: eagle-vpn
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find eagle-vpn/app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find eagle-vpn/app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Generate SHA-256
        run: |
          find eagle-vpn/app/build/outputs/apk -type f -name '*.apk' -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload EAGLE VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: eagle-vpn-apk
          path: |
            eagle-vpn/app/build/outputs/apk/**/*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eagle-vpn-${{ github.run_number }}
          name: EAGLE VPN ${{ github.run_number }}
          generate_release_notes: true
          files: |
            eagle-vpn/app/build/outputs/apk/**/*.apk
            SHA256SUMS.txt
